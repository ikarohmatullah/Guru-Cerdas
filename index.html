function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

let toastTimer = null;
function showToast(message, type = "info") {
  const container = document.getElementById("global-toast");
  const card = document.getElementById("global-toast-card");
  const icon = document.getElementById("global-toast-icon");
  const text = document.getElementById("global-toast-text");
  if (!container || !card || !icon || !text) return;

  const styles = {
    success: { border: "border-emerald-300 bg-emerald-50 text-emerald-950", ico: "✅" },
    error: { border: "border-rose-300 bg-rose-50 text-rose-950", ico: "⚠️" },
    info: { border: "border-brand-300 bg-white text-slate-900", ico: "ℹ️" }
  };
  const s = styles[type] || styles.info;
  card.className = `rounded-2xl shadow-xl border p-4 flex items-start gap-3 ${s.border}`;
  icon.textContent = s.ico;
  text.innerHTML = message;

  container.classList.remove("translate-y-24", "opacity-0", "pointer-events-none");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    container.classList.add("translate-y-24", "opacity-0", "pointer-events-none");
  }, 4200);
}

function copyTextFallback(text, successMsg = "Teks berhasil disalin!") {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showToast(successMsg, "success");
  } catch (err) {
    showToast("Gagal menyalin otomatis. Silakan salin teks secara manual.", "error");
  }
  document.body.removeChild(ta);
}

function loadStateFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== "object") return;

    const mergeKeys = [
      "isAuthenticated",
      "isAdmin",
      "user",
      "dataBagian",
      "activeClassKey",
      "soalPenilaianTab",
      "classProfile",
      "savedClasses",

      "questions",
      "scoreRecords",
      "students",
      "classStudents",
      "journals",
      "registeredUsers",
      "accessRequests",
      "driveSync"
    ];

    mergeKeys.forEach(k => {

async function callGeminiAPI(prompt, systemInstruction = "", responseSchema = null) {
  const apiKey = "";
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

  const payload = {
    contents: [{ parts: [{ text: prompt }] }]
  };

  if (systemInstruction) {
    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
  }

  if (responseSchema) {
    payload.generationConfig = {
      responseMimeType: "application/json",
      responseSchema: responseSchema
    };
  }

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    throw new Error(`HTTP ${res.status}`);
  }

  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error("Respons AI kosong");
  return text;
}

function inferFaseFromJenjangKelas(jenjang, kelas) {
  if (jenjang === "PAUD / TK") return "Fase Fondasi";
  if (jenjang === "SMP / MTs") return "Fase D";
  if (jenjang === "SMA / SMK / MA") {
    return kelas === "Kelas 10" ? "Fase E" : "Fase F";
  }
  if (kelas === "Kelas 1" || kelas === "Kelas 2") return "Fase A";
  if (kelas === "Kelas 3" || kelas === "Kelas 4") return "Fase B";
  return "Fase C";
}

function getClassGroupIdFromProfile(p) {
  if (p && p.classGroupId) return p.classGroupId;
  const j = String(p?.jenjang || "SD / MI").toLowerCase().replace(/[^a-z0-9]+/g, "_");
  const k = String(p?.kelas || "Kelas 4").toLowerCase().replace(/[^a-z0-9]+/g, "_");
  const s = String(p?.semester || "1").startsWith("2") ? "sem_2" : "sem_1";
  return `grp_${j}_${k}_${s}`;
}

function getSubjectsInActiveClassGroup() {
  const activeGroupId = getClassGroupIdFromProfile(state.classProfile);
  if (state.savedClasses[state.activeClassKey]) {
    state.savedClasses[state.activeClassKey] = {
      ...JSON.parse(JSON.stringify(state.classProfile)),
      key: state.activeClassKey,
      classGroupId: activeGroupId,
      label: `${state.classProfile.kelas} · ${state.classProfile.mapel}`
    };
  }
  return Object.keys(state.savedClasses)
    .map(k => ({
      ...state.savedClasses[k],
      key: k,
      classGroupId: getClassGroupIdFromProfile(state.savedClasses[k])
    }))
    .filter(item => item.classGroupId === activeGroupId);
}

function getDistinctClassGroups() {
  const map = {};
  Object.keys(state.savedClasses).forEach(k => {
    const item = state.savedClasses[k];
    const gid = getClassGroupIdFromProfile(item);
    if (!map[gid]) {
      map[gid] = {
        groupId: gid,
        jenjang: item.jenjang,
        kelas: item.kelas,
        fase: item.fase,
        semester: item.semester,
        firstKey: k,
        subjects: []
      };
    }
    map[gid].subjects.push({ key: k, mapel: item.mapel });
  });
  return Object.values(map);
}

function syncActiveClassGroupMetadata(newJenjang, newKelas, newSemester) {
  const oldGroupId = getClassGroupIdFromProfile(state.classProfile);
  const p = state.classProfile;
  const catalog = CURRICULUM_CATALOG[newJenjang] || CURRICULUM_CATALOG["SD / MI"];

  p.jenjang = newJenjang;
  p.kelas = newKelas;
  p.fase = inferFaseFromJenjangKelas(newJenjang, newKelas);
  p.semester = newSemester;
  p.menitPerJp = catalog.defaultMenit;
  const newGroupId = getClassGroupIdFromProfile({ jenjang: newJenjang, kelas: newKelas, semester: newSemester });
  p.classGroupId = newGroupId;

  if (oldGroupId !== newGroupId && Array.isArray(state.classStudents[oldGroupId]) && !Array.isArray(state.classStudents[newGroupId])) {
    state.classStudents[newGroupId] = state.classStudents[oldGroupId];
    delete state.classStudents[oldGroupId];
  }

  Object.keys(state.savedClasses).forEach(k => {
    const item = state.savedClasses[k];
    if (getClassGroupIdFromProfile(item) === oldGroupId || k === state.activeClassKey) {
      item.jenjang = newJenjang;
      item.kelas = newKelas;
      item.fase = p.fase;
      item.semester = newSemester;
      item.menitPerJp = catalog.defaultMenit;
      item.classGroupId = newGroupId;
      if (k === state.activeClassKey) {
        item.mapel = p.mapel;
        item.cpText = p.cpText;
        item.topikSemester = [...p.topikSemester];
      }
      item.label = `${newKelas} · ${item.mapel}`;
    }
  });
}

function handleDynamicJenjangChange(newJenjang) {
  const catalog = CURRICULUM_CATALOG[newJenjang];
  if (!catalog) return;
  const p = state.classProfile;
  const newKelas = catalog.kelasList[0];
  p.jpPerMinggu = catalog.defaultJp;

  const mapelKeys = Object.keys(catalog.mapels);
  p.mapel = mapelKeys[0];
  if (p.cpSourceMode !== "kustom") {
    p.cpText = catalog.mapels[p.mapel] || "";
  }
  p.topikSemester = getTopicsForJenjangMapel(newJenjang, p.mapel);
  p.modul1Index = 0;
  p.modul2Index = 1;
  state.selectedBabIndex = 0;
  state.harianConfig.babIndex = 0;
  state.sumatifConfig.babIndex = 0;

  syncActiveClassGroupMetadata(newJenjang, newKelas, p.semester);
  persistStateToStorage(true);
  render();
}

function handleDynamicKelasChange(newKelas) {
  const p = state.classProfile;
  if (p.jenjang === "SD / MI") {
    const angka = newKelas.replace("Kelas ", "");
    const romawi = { "1": "I", "2": "II", "3": "III", "4": "IV", "5": "V", "6": "VI" }[angka] || angka;
    p.jabatanGuru = `Guru Kelas ${romawi}`;
  } else {
    p.jabatanGuru = `Guru Mata Pelajaran ${p.mapel}`;
  }
  syncActiveClassGroupMetadata(p.jenjang, newKelas, p.semester);
  persistStateToStorage(true);
  render();
}

function handleDynamicSemesterChange(newSemester) {
  const p = state.classProfile;
  syncActiveClassGroupMetadata(p.jenjang, p.kelas, newSemester);
  persistStateToStorage(true);
  render();
}

function handleDynamicMapelChange(newMapel) {
  const cleanMapel = String(newMapel || "").trim();
  if (!cleanMapel) return;
  const p = state.classProfile;
  const catalog = CURRICULUM_CATALOG[p.jenjang];
  p.mapel = cleanMapel;
  if (catalog && catalog.mapels[cleanMapel] && p.cpSourceMode !== "kustom") {
    p.cpText = catalog.mapels[cleanMapel];
  } else if (!catalog?.mapels[cleanMapel]) {
    p.cpText = `Peserta didik mampu memahami, menerapkan, dan merefleksikan kompetensi esensial pada mata pelajaran ${cleanMapel} sesuai fase perkembangan.`;
  }
  p.topikSemester = getTopicsForJenjangMapel(p.jenjang, cleanMapel);
  p.modul1Index = 0;
  p.modul2Index = 1;
  state.selectedBabIndex = 0;
  state.harianConfig.babIndex = 0;
  state.sumatifConfig.babIndex = 0;

  if (p.jenjang !== "SD / MI") {
    p.jabatanGuru = `Guru Mata Pelajaran ${cleanMapel}`;
  }
  if (state.savedClasses[state.activeClassKey]) {
    state.savedClasses[state.activeClassKey] = {
      ...JSON.parse(JSON.stringify(p)),
      key: state.activeClassKey,
      classGroupId: getClassGroupIdFromProfile(p),
      label: `${p.kelas} · ${cleanMapel}`
    };
  }
  persistStateToStorage(true);
  render();
}

function addSubjectToActiveClass(subjectNameInput) {
  const cleanName = String(subjectNameInput || "").trim();
  if (!cleanName) {
    showToast("Pilih mata pelajaran dari daftar atau ketik nama pelajaran terlebih dahulu.", "error");
    return;
  }

  const groupSubjects = getSubjectsInActiveClassGroup();
  const existing = groupSubjects.find(s => s.mapel.toLowerCase() === cleanName.toLowerCase());
  if (existing) {
    state.showAddSubjectPanel = false;
    state.customSubjectDraft = "";
    switchActiveClass(existing.key);
    return;
  }

  const p = state.classProfile;
  const groupId = getClassGroupIdFromProfile(p);
  const newKey = "subj-" + Date.now().toString(36);
  const catalog = CURRICULUM_CATALOG[p.jenjang] || CURRICULUM_CATALOG["SD / MI"];
  const newProfile = JSON.parse(JSON.stringify(p));

  newProfile.classGroupId = groupId;
  newProfile.mapel = cleanName;
  newProfile.cpSourceMode = "resmi";
  newProfile.cpText = catalog.mapels[cleanName]
    || `Peserta didik mampu memahami konsep dasar, menerapkan keterampilan, serta merefleksikan pembelajaran ${cleanName} pada ${p.kelas} (${p.fase}) secara bermakna.`;
  newProfile.topikSemester = getTopicsForJenjangMapel(p.jenjang, cleanName);
  newProfile.modul1Index = 0;
  newProfile.modul2Index = 1;
  if (p.jenjang !== "SD / MI") {
    newProfile.jabatanGuru = `Guru Mata Pelajaran ${cleanName}`;
  }

  state.savedClasses[newKey] = {
    ...JSON.parse(JSON.stringify(newProfile)),
    key: newKey,
    classGroupId: groupId,
    label: `${p.kelas} · ${cleanName}`
  };
  state.activeClassKey = newKey;
  state.classProfile = newProfile;
  state.showAddSubjectPanel = false;
  state.customSubjectDraft = "";
  state.selectedBabIndex = 0;
  state.harianConfig.babIndex = 0;
  state.sumatifConfig.babIndex = 0;
  persistStateToStorage(true);
  showToast(`Pelajaran <b>${escapeHtml(cleanName)}</b> berhasil ditambahkan ke <b>${escapeHtml(p.kelas)}</b>!`, "success");
  render();
}

function removeSubjectFromActiveClass(subjectKey) {
  const groupSubjects = getSubjectsInActiveClassGroup();
  if (groupSubjects.length <= 1) {
    showToast("Minimal harus ada 1 mata pelajaran aktif di kelas ini.", "error");
    return;
  }
  if (state.pendingDeleteClassKey !== subjectKey) {
    state.pendingDeleteClassKey = subjectKey;
    showToast("Klik sekali lagi tanda <b>×</b> untuk menghapus mata pelajaran ini dari kelas.", "info");
    render();
    return;
  }
  delete state.savedClasses[subjectKey];
  state.pendingDeleteClassKey = null;
  const remaining = getSubjectsInActiveClassGroup();
  const nextObj = remaining[0] || Object.values(state.savedClasses)[0];
  if (nextObj) {
    state.activeClassKey = nextObj.key;
    state.classProfile = JSON.parse(JSON.stringify(state.savedClasses[nextObj.key]));
  }
  persistStateToStorage(true);
  showToast("Mata pelajaran dihapus dari kelas.", "success");
  render();
}

function switchActiveClass(classKey) {
  if (!state.savedClasses[classKey]) return;
  if (state.savedClasses[state.activeClassKey]) {
    state.savedClasses[state.activeClassKey] = {
      ...JSON.parse(JSON.stringify(state.classProfile)),
      key: state.activeClassKey,
      classGroupId: getClassGroupIdFromProfile(state.classProfile),
      label: `${state.classProfile.kelas} · ${state.classProfile.mapel}`
    };
  }
  state.activeClassKey = classKey;
  state.pendingDeleteClassKey = null;
  state.classProfile = JSON.parse(JSON.stringify(state.savedClasses[classKey]));
  state.selectedBabIndex = 0;
  state.harianConfig.babIndex = 0;
  state.sumatifConfig.babIndex = 0;
  persistStateToStorage(true);
  showToast(`Aktif pada <b>${escapeHtml(state.classProfile.kelas)} · ${escapeHtml(state.classProfile.mapel)}</b>`, "info");
  render();
}

function createNewClassSlot() {
  if (state.savedClasses[state.activeClassKey]) {
    state.savedClasses[state.activeClassKey] = {
      ...JSON.parse(JSON.stringify(state.classProfile)),
      key: state.activeClassKey,
      classGroupId: getClassGroupIdFromProfile(state.classProfile),
      label: `${state.classProfile.kelas} · ${state.classProfile.mapel}`
    };
  }
  const newKey = "cls-" + Date.now().toString(36);
  const newProfile = createDefaultClassProfile();
  Object.assign(newProfile, {
    namaDinas: state.classProfile.namaDinas,
    sekolah: state.classProfile.sekolah,
    logoDataUrl: state.classProfile.logoDataUrl || "",
    npsn: state.classProfile.npsn,
    alamatSekolah: state.classProfile.alamatSekolah,
    kelurahan: state.classProfile.kelurahan,
    kecamatan: state.classProfile.kecamatan,
    kabKota: state.classProfile.kabKota,
    provinsi: state.classProfile.provinsi,
    kodePos: state.classProfile.kodePos,
    teleponSekolah: state.classProfile.teleponSekolah,
    emailSekolah: state.classProfile.emailSekolah,
    kepalaSekolah: state.classProfile.kepalaSekolah,
    nipKepsek: state.classProfile.nipKepsek,
    namaGuru: state.classProfile.namaGuru,
    nipGuru: state.classProfile.nipGuru,
    tahunPelajaran: state.classProfile.tahunPelajaran,
    tanggalTtd: state.classProfile.tanggalTtd
  });

  const existingGroups = new Set(getDistinctClassGroups().map(g => g.groupId));
  const candidateClasses = ["Kelas 5", "Kelas 6", "Kelas 1", "Kelas 2", "Kelas 3", "Kelas 4"];
  const pickedKelas = candidateClasses.find(k => !existingGroups.has(getClassGroupIdFromProfile({ jenjang: "SD / MI", kelas: k, semester: "1 (Ganjil)" }))) || "Kelas 5";

  newProfile.kelas = pickedKelas;
  newProfile.fase = inferFaseFromJenjangKelas("SD / MI", pickedKelas);
  const angka = pickedKelas.replace("Kelas ", "");
  const romawi = { "1": "I", "2": "II", "3": "III", "4": "IV", "5": "V", "6": "VI" }[angka] || angka;
  newProfile.jabatanGuru = `Guru Kelas ${romawi}`;
  newProfile.classGroupId = getClassGroupIdFromProfile(newProfile);

  state.savedClasses[newKey] = {
    ...JSON.parse(JSON.stringify(newProfile)),
    key: newKey,
    classGroupId: newProfile.classGroupId,
    label: `${newProfile.kelas} · ${newProfile.mapel}`
  };
  state.activeClassKey = newKey;
  state.classProfile = newProfile;
  state.selectedBabIndex = 0;
  persistStateToStorage(true);
  showToast(`Kelas baru (<b>${escapeHtml(pickedKelas)}</b>) siap! Silakan tambahkan pelajaran.`, "success");
  render();
}

function duplicateActiveClassSlot() {
  if (state.savedClasses[state.activeClassKey]) {
    state.savedClasses[state.activeClassKey] = {
      ...JSON.parse(JSON.stringify(state.classProfile)),
      key: state.activeClassKey,
      classGroupId: getClassGroupIdFromProfile(state.classProfile),
      label: `${state.classProfile.kelas} · ${state.classProfile.mapel}`
    };
  }
  const newKey = "cls-" + Date.now().toString(36);
  const copyProfile = JSON.parse(JSON.stringify(state.classProfile));
  state.savedClasses[newKey] = {
    ...copyProfile,
    key: newKey,
    classGroupId: getClassGroupIdFromProfile(copyProfile),
    label: `${copyProfile.kelas} · ${copyProfile.mapel} (Salinan)`
  };
  state.activeClassKey = newKey;
  state.classProfile = JSON.parse(JSON.stringify(copyProfile));
  persistStateToStorage(true);
  showToast("Pengaturan kelas berhasil diduplikasi!", "success");
  render();
}

function deleteClassSlot(classKey) {
  const keys = Object.keys(state.savedClasses);
  if (keys.length <= 1) {
    showToast("Minimal harus tersedia 1 kelas aktif.", "error");
    return;
  }
  if (state.pendingDeleteClassKey !== classKey) {
    state.pendingDeleteClassKey = classKey;
    showToast("Klik sekali lagi tombol hapus untuk mengonfirmasi penghapusan kelas.", "info");
    render();
    return;
  }
  delete state.savedClasses[classKey];
  state.pendingDeleteClassKey = null;
  const remainingKeys = Object.keys(state.savedClasses);
  const fallbackKey = remainingKeys[0];
  state.activeClassKey = fallbackKey;
  state.classProfile = JSON.parse(JSON.stringify(state.savedClasses[fallbackKey]));
  persistStateToStorage(true);
  showToast("Slot kelas berhasil dihapus.", "success");
  render();
}

function downloadAsWordDoc(filenamePrefix, titleText, htmlBody) {
  const fullHtml = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office'
          xmlns:w='urn:schemas-microsoft-com:office:word'
          xmlns='http://www.w3.org/TR/REC-html40'>
    <head>
      <meta charset='utf-8'>
      <title>${escapeHtml(titleText)}</title>
      <style>
        @page { size: A4; margin: 2cm 2cm 2cm 2.5cm; }
        body { font-family: 'Times New Roman', serif; font-size: 11pt; line-height: 1.4; color: #000000; }
        h1, h2, h3 { color: #000000; margin-top: 10pt; margin-bottom: 5pt; }
        table { width: 100%; border-collapse: collapse; margin: 8pt 0; }
        th, td { border: 1pt solid #000000; padding: 5pt 6pt; vertical-align: top; text-align: left; }
        th { background-color: #f0f0f0; font-weight: bold; }
      </style>
    </head>
    <body>
      ${buildWordLetterheadHtml()}
      ${htmlBody}
      ${buildWordSignatureHtml()}
    </body>
    </html>
  `;

  const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${filenamePrefix}.doc`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast(`Dokumen <b>${escapeHtml(filenamePrefix)}.doc</b> berhasil diunduh!`, "success");
}

function handleLoginSubmit(e) {
  e.preventDefault();
  const email = (document.getElementById("login-email")?.value || "").trim().toLowerCase();
  const password = document.getElementById("login-password")?.value || "";

  if (email === ADMIN_EMAIL.toLowerCase() && password === ADMIN_PASSWORD) {
    state.isAuthenticated = true;
    state.isAdmin = true;
    state.user = {
      name: "Ika Rohmatullah F., S.Pd.",
      email: ADMIN_EMAIL,
      sekolah: state.classProfile.sekolah || "SDN Karaton 1"
    };
    state.activeRoute = "dashboard";
    persistStateToStorage(true);
    showToast("Selamat datang kembali, <b>Admin Ika Rohmatullah F., S.Pd.</b>!", "success");
    render();
    return;
  }

  const foundUser = state.registeredUsers.find(
    u => u.email.toLowerCase() === email && u.password === password && u.status === "aktif"
  );
  if (foundUser) {
    state.isAuthenticated = true;
    state.isAdmin = foundUser.role === "admin";
    state.user = {
      name: foundUser.name,
      email: foundUser.email,
      sekolah: foundUser.sekolah || state.classProfile.sekolah
    };
    state.activeRoute = "dashboard";
    persistStateToStorage(true);
    showToast(`Berhasil masuk sebagai <b>${escapeHtml(foundUser.name)}</b>!`, "success");
    render();
    return;
  }

  showToast("Email atau password belum terdaftar / belum diaktifkan.", "error");
}

function handleDaftarSubmit(e) {
  e.preventDefault();
  const name = (document.getElementById("daftar-nama")?.value || "").trim();
  const email = (document.getElementById("daftar-email")?.value || "").trim();
  const password = (document.getElementById("daftar-password")?.value || "").trim();
  const sekolah = (document.getElementById("daftar-sekolah")?.value || "").trim();
  const whatsapp = (document.getElementById("daftar-wa")?.value || "").trim();
  const catatan = (document.getElementById("daftar-catatan")?.value || "").trim();

  if (!name || !email || !password || !sekolah) {
    showToast("Mohon lengkapi seluruh kolom wajib pendaftaran.", "error");
    return;
  }

  state.accessRequests.unshift({
    id: "req-" + Date.now(),
    name,
    email,
    password,
    sekolah,
    whatsapp: whatsapp || "-",
    metodeBayar: "Akses Publik / Pendaftaran Mandiri",
    catatan: catatan || "Permohonan aktivasi akun baru melalui portal publik.",
    status: "menunggu",
    tanggal: new Date().toISOString().slice(0, 10)
  });

  persistStateToStorage(true);
  showToast("Permohonan pendaftaran berhasil dikirim! Admin dapat menyetujui di menu Akun.", "success");
  navigate("login");
}

function handleLogout() {
  state.isAuthenticated = false;
  state.isAdmin = false;
  state.activeRoute = "landing";
  persistStateToStorage(true);
  showToast("Anda telah keluar dari sesi akun.", "info");
  render();
}

function handleCheckerSubmit(e) {
  e.preventDefault();
  const raw = (document.getElementById("checker-text")?.value || "").trim();
  state.checkerInput = raw;
  if (!raw) {
    showToast("Tempel teks CP, ATP, atau Modul Ajar terlebih dahulu.", "error");
    return;
  }

  const lower = raw.toLowerCase();
  const checks = [
    {
      label: "Capaian Pembelajaran (CP) & Tujuan Pembelajaran (TP)",
      ok: lower.includes("tujuan") || lower.includes("capaian") || lower.includes("peserta didik"),
      tip: "Pastikan TP memuat kompetensi (kata kerja operasional) dan lingkup materi."
    },
    {
      label: "Alokasi Waktu & JP Terukur",
      ok: lower.includes("jp") || lower.includes("menit") || lower.includes("pertemuan"),
      tip: "Cantumkan jumlah JP dan pembagian pertemuan agar selaras dengan Promes."
    },
    {
      label: "Langkah Pembelajaran Bermakna / Berdiferensiasi",
      ok: lower.includes("pendahuluan") || lower.includes("inti") || lower.includes("penutup") || lower.includes("memahami") || lower.includes("mengaplikasi"),
      tip: "Sertakan kegiatan pendahuluan, inti (eksplorasi/diferensiasi), dan refleksi penutup."
    },
    {
      label: "Asesmen Formatif / Sumatif & KKTP",
      ok: lower.includes("asesmen") || lower.includes("penilaian") || lower.includes("rubrik") || lower.includes("kktp"),
      tip: "Lengkapi instrumen penilaian proses (LKPD/observasi) dan kriteria ketercapaian."
    }
  ];

  const passed = checks.filter(c => c.ok).length;
  state.checkerResult = {
    score: Math.round((passed / checks.length) * 100),
    passed,
    total: checks.length,
    checks
  };
  render();
}

function getActiveClassStudents() {
  if (!state.classStudents || typeof state.classStudents !== "object") {
    state.classStudents = {};
  }
  const groupKey = getClassGroupIdFromProfile(state.classProfile);
  const legacyKey = state.activeClassKey || "klnlt2kcp1";
  if (!Array.isArray(state.classStudents[groupKey])) {
    if (Array.isArray(state.classStudents[legacyKey])) {
      state.classStudents[groupKey] = state.classStudents[legacyKey];
    } else {
      state.classStudents[groupKey] = JSON.parse(JSON.stringify(state.students || []));
    }
  }
  return state.classStudents[groupKey];
}

function applyRosterCountToClassProfile(roster, shouldRender = false) {
  if (!Array.isArray(roster)) return;
  const cepat = roster.filter(s => s.kelompok === "Cepat Menangkap").length;
  const sedang = roster.filter(s => s.kelompok === "Sedang").length;
  const pendampingan = roster.filter(s => s.kelompok === "Perlu Didampingi").length;
  state.classProfile.jumlahMurid = roster.length;
  state.classProfile.sebaranCepat = cepat;
  state.classProfile.sebaranSedang = sedang;
  state.classProfile.sebaranPendampingan = pendampingan;
  if (shouldRender) render();
}

function handleLogoUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    state.classProfile.logoDataUrl = ev.target.result;
    if (state.savedClasses[state.activeClassKey]) {
      state.savedClasses[state.activeClassKey].logoDataUrl = ev.target.result;
    }
    persistStateToStorage(true);
    showToast("Logo kop surat berhasil diunggah!", "success");
    render();
  };
  reader.readAsDataURL(file);
}

function handleSaveProfilKelas(e) {
  e.preventDefault();
  const p = state.classProfile;
  p.cpText = document.getElementById("kls-cp").value.trim();
  p.jpPerMinggu = parseInt(document.getElementById("kls-jp").value, 10) || p.jpPerMinggu;
  p.mingguEfektif = parseInt(document.getElementById("kls-minggu").value, 10) || p.mingguEfektif;
  p.menitPerJp = parseInt(document.getElementById("kls-menit").value, 10) || p.menitPerJp;
  p.sarana = document.getElementById("kls-sarana").value.trim();
  p.konteksLokal = document.getElementById("kls-konteks").value.trim();
  p.kebutuhanKhusus = document.getElementById("kls-khusus").value.trim();

  const topicsRaw = document.getElementById("kls-topik").value
    .split("\n")
    .map(t => t.trim())
    .filter(Boolean);
  if (topicsRaw.length > 0) {
    p.topikSemester = topicsRaw;
  }

  const groupId = getClassGroupIdFromProfile(p);
  p.classGroupId = groupId;
  if (state.savedClasses[state.activeClassKey]) {
    state.savedClasses[state.activeClassKey] = {
      ...JSON.parse(JSON.stringify(p)),
      key: state.activeClassKey,
      classGroupId: groupId,
      label: `${p.kelas} · ${p.mapel}`
    };
  }
  persistStateToStorage(true);
  showToast(`Detail pelajaran <b>${escapeHtml(p.mapel)}</b> pada <b>${escapeHtml(p.kelas)}</b> berhasil disimpan!`, "success");
  render();
}

function handleAddStudent(e) {
  e.preventDefault();
  const roster = getActiveClassStudents();
  const nama = (document.getElementById("stu-nama")?.value || "").trim();
  if (!nama) return;
  const nis = (document.getElementById("stu-nis")?.value || "").trim() || String(2026000 + roster.length + 1);
  const jk = document.getElementById("stu-jk")?.value || "L";
  const kelompok = document.getElementById("stu-kelompok")?.value || "Sedang";

  roster.push({
    no: roster.length + 1,
    nis,
    nama,
    jk,
    kelompok,
    status: "H"
  });
  applyRosterCountToClassProfile(roster, false);
  persistStateToStorage(true);
  showToast(`Siswa <b>${escapeHtml(nama)}</b> berhasil ditambahkan!`, "success");
  render();
}

function updateStudentGroup(idx, newGroup) {
  const roster = getActiveClassStudents();
  if (!roster[idx]) return;
  roster[idx].kelompok = newGroup;
  applyRosterCountToClassProfile(roster, false);
  persistStateToStorage(true);
  render();
}

function removeStudent(idx) {
  const roster = getActiveClassStudents();
  roster.splice(idx, 1);
  roster.forEach((s, i) => (s.no = i + 1));
  applyRosterCountToClassProfile(roster, false);
  persistStateToStorage(true);
  showToast("Data siswa dihapus.", "info");
  render();
}

function downloadStudentExcelTemplate() {
  if (typeof XLSX === "undefined") {
    showToast("Pustaka Excel belum termuat. Silakan muat ulang halaman.", "error");
    return;
  }
  const sampleRows = [
    { NIS: "2026001", "Nama Lengkap": "Alya Putri Rahmadani", "L/P": "P", "Kelompok Kesiapan": "Cepat Menangkap" },
    { NIS: "2026002", "Nama Lengkap": "Bima Sakti Nugroho", "L/P": "L", "Kelompok Kesiapan": "Sedang" },
    { NIS: "2026003", "Nama Lengkap": "Citra Kirana Dewi", "L/P": "P", "Kelompok Kesiapan": "Perlu Didampingi" }
  ];
  const ws = XLSX.utils.json_to_sheet(sampleRows);
  ws["!cols"] = [{ wch: 14 }, { wch: 30 }, { wch: 8 }, { wch: 24 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Daftar_Siswa");
  XLSX.writeFile(wb, `Template_Daftar_Siswa_${state.classProfile.kelas.replace(/\s+/g, "_")}.xlsx`);
  showToast("Templat Excel <b>Template_Daftar_Siswa.xlsx</b> berhasil diunduh!", "success");
}

function normalizeKelompokFromExcel(rawVal) {
  const v = String(rawVal || "").trim().toLowerCase();
  if (v.includes("cepat") || v.includes("mahir") || v.includes("tinggi")) return "Cepat Menangkap";
  if (v.includes("damping") || v.includes("bimbing") || v.includes("perlu") || v.includes("rendah")) return "Perlu Didampingi";
  return "Sedang";
}

function handleImportStudentsExcel(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (typeof XLSX === "undefined") {
    showToast("Pustaka Excel (SheetJS) belum siap. Periksa koneksi internet Anda.", "error");
    return;
  }

  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

      if (!Array.isArray(rows) || rows.length === 0) {
        showToast("File Excel kosong atau tidak memiliki baris data siswa.", "error");
        return;
      }

      const roster = getActiveClassStudents();
      let importedCount = 0;

      rows.forEach(row => {
        const keyMap = {};
        Object.keys(row).forEach(k => {
          keyMap[k.trim().toLowerCase()] = row[k];
        });

        const namaRaw =
          keyMap["nama lengkap"] ||
          keyMap["nama siswa"] ||
          keyMap["nama murid"] ||
          keyMap["nama"] ||
          keyMap["name"] ||
          "";
        const nama = String(namaRaw).trim();
        if (!nama) return;

        const nisRaw = keyMap["nis"] || keyMap["nisn"] || keyMap["nomor induk"] || "";
        const nis = String(nisRaw).trim() || String(2026000 + roster.length + 1);

        const jkRaw = String(keyMap["l/p"] || keyMap["jk"] || keyMap["jenis kelamin"] || "L").trim().toUpperCase();
        const jk = jkRaw.startsWith("P") || jkRaw === "W" || jkRaw === "F" ? "P" : "L";

        const kelRaw =
          keyMap["kelompok kesiapan"] ||
          keyMap["kelompok"] ||
          keyMap["kesiapan"] ||
          keyMap["kategori"] ||
          "Sedang";
        const kelompok = normalizeKelompokFromExcel(kelRaw);

        roster.push({
          no: roster.length + 1,
          nis,
          nama,
          jk,
          kelompok,
          status: "H"
        });
        importedCount++;
      });

      if (importedCount === 0) {
        showToast("Kolom <b>Nama</b> / <b>Nama Lengkap</b> tidak ditemukan pada file Excel.", "error");
        return;
      }

      roster.forEach((s, i) => (s.no = i + 1));
      applyRosterCountToClassProfile(roster, false);
      persistStateToStorage(true);
      showToast(`Berhasil mengimpor <b>${importedCount} siswa</b> dari file Excel!`, "success");
      render();
    } catch (err) {
      showToast("Gagal membaca file Excel. Pastikan format file adalah .xlsx, .xls, atau .csv.", "error");
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsArrayBuffer(file);
}

function clearAllStudentsInActiveClass() {
  const roster = getActiveClassStudents();
  if (roster.length === 0) {

    return;
  }

    showToast("Klik tombol <b>Konfirmasi Hapus Semua?</b> sekali lagi untuk mengosongkan daftar siswa.", "info");
    render();
    return;
  }
  roster.splice(0, roster.length);
  state.confirmClearAllStudents = false;
  applyRosterCountToClassProfile(roster, false);
  persistStateToStorage(true);
  showToast("Seluruh data siswa pada kelas ini berhasil dihapus.", "success");
  render();
}

async function generateSelectedDocument(useAi = false) {
  const p = state.classProfile;
  const babTitle = p.topikSemester[state.selectedBabIndex] || p.topikSemester[0] || "Materi Pembelajaran";
  const docKey = `${state.activeClassKey}_${state.selectedDocType}_${state.selectedBabIndex}_${state.formatMode}`;

  if (!useAi) {
    state.generatedDocs[docKey] = buildFallbackLocalDocument(state.selectedDocType, babTitle);
    persistStateToStorage(true);
    showToast("Perangkat ajar berhasil disusun & siap diunduh ke Word (.doc)!", "success");
    render();
    return;
  }

  state.isGenerating = true;
  render();
  try {
    const docNames = {
      modul: state.formatMode === "rpm" ? "Rencana Pembelajaran Mendalam (RPM)" : "Modul Ajar Kurikulum Merdeka",
      atp: "Alur Tujuan Pembelajaran (ATP)",
      prota: "Program Tahunan (Prota)",
      promes: "Program Semester (Promes)",
      lkpd: "Lembar Kerja Peserta Didik (LKPD) & Rubrik",
      rapor: "Deskripsi Capaian Kompetensi Rapor"
    };
    const prompt = `Susun dokumen ${docNames[state.selectedDocType]} lengkap dalam format HTML bersih (menggunakan tag <h2>, <h3>, <p>, <table>, <tr>, <th>, <td>, <ul>, <ol>) tanpa markdown code fence.
Identitas: Sekolah ${p.sekolah}, Jenjang ${p.jenjang}, ${p.fase}, ${p.kelas}, Mapel ${p.mapel}, Semester ${p.semester}, Topik Utama "${babTitle}", CP: "${p.cpText}", Alokasi ${p.jpPerMinggu} JP/minggu (${p.menitPerJp} menit/JP), Jumlah murid ${p.jumlahMurid} (Cepat: ${p.sebaranCepat}, Sedang: ${p.sebaranSedang}, Pendampingan: ${p.sebaranPendampingan}).`;

    const aiHtml = await callGeminiAPI(prompt, "Anda adalah pakar kurikulum nasional Indonesia. Hasilkan HTML tabel perangkat ajar yang rapi, sistematis, dan siap cetak ke Microsoft Word.");
    const cleaned = aiHtml.replace(/^```html\s*/i, "").replace(/```$/i, "").trim();
    state.generatedDocs[docKey] = cleaned || buildFallbackLocalDocument(state.selectedDocType, babTitle);
    showToast("Perangkat ajar berhasil dibuat dengan AI!", "success");
  } catch (err) {
    state.generatedDocs[docKey] = buildFallbackLocalDocument(state.selectedDocType, babTitle);
    showToast("Menggunakan templat terstruktur standar Kurikulum Nasional.", "info");
  } finally {
    state.isGenerating = false;
    persistStateToStorage(true);
    render();
  }
}

function buildTopicQuickQuestions(topicTitle, count, categoryLabel) {
  const n = Math.min(35, Math.max(1, parseInt(count || 5, 10)));
  const p = state.classProfile;
  const templates = [
    {
      q: `Konsep utama yang dipelajari pada materi "${topicTitle}" (${p.mapel} ${p.kelas}) bertujuan agar murid mampu ....`,
      a: ["Memahami dan menerapkan konsep dalam pemecahan masalah nyata", "Menghafal istilah tanpa memahami maknanya", "Mengabaikan langkah kerja sistematis", "Menghindari diskusi kelompok"],
      c: "Memahami dan menerapkan konsep dalam pemecahan masalah nyata"
    },
    {
      q: `Langkah pertama yang paling tepat ketika menyelesaikan persoalan kontekstual terkait "${topicTitle}" adalah ....`,
      a: ["Mengidentifikasi informasi yang diketahui dan ditanyakan", "Langsung menebak hasil akhir tanpa menghitung", "Melewati pemeriksaan kembali jawaban", "Mengabaikan satuan atau aturan dasar"],
      c: "Mengidentifikasi informasi yang diketahui dan ditanyakan"
    },
    {
      q: `Dalam pembelajaran "${topicTitle}", sikap bernalar kritis ditunjukkan dengan cara ....`,
      a: ["Memeriksa kebenaran langkah penyelesaian dan memberikan alasan logis", "Menyalin pekerjaan teman tanpa bertanya", "Menolak masukan dari anggota kelompok", "Berhenti mencoba saat menemui soal tantangan"],
      c: "Memeriksa kebenaran langkah penyelesaian dan memberikan alasan logis"
    },
    {
      q: `Penerapan materi "${topicTitle}" dalam kehidupan sehari-hari di lingkungan sekolah bermanfaat untuk ....`,
      a: ["Membantu mengambil keputusan yang tepat dan terukur", "Membuat pekerjaan menjadi lebih rumit", "Mengurangi ketelitian dalam bekerja", "Menghambat kerja sama tim"],
      c: "Membantu mengambil keputusan yang tepat dan terukur"
    },
    {
      q: `Apabila ditemukan hasil yang kurang tepat saat latihan "${topicTitle}", tindakan evaluasi diri yang baik adalah ....`,
      a: ["Menelusuri kembali setiap langkah kerja dan memperbaikinya", "Membiarkan kesalahan tanpa koreksi", "Menyalahkan soal yang diberikan", "Tidak mengikuti kegiatan refleksi"],
      c: "Menelusuri kembali setiap langkah kerja dan memperbaikinya"
    }
  ];

  const list = [];
  for (let i = 0; i < n; i++) {
    const base = templates[i % templates.length];
    const suffix = i >= templates.length ? ` (Variasi ${Math.floor(i / templates.length) + 1})` : "";
    list.push({
      question: `[${i + 1}] ${base.q}${suffix}`,
      answers: [...base.a],
      correct: base.c,
      category: categoryLabel,
      explanation: `Pembahasan materi ${topicTitle}: Jawaban yang tepat adalah "${base.c}".`
    });
  }
  return list;
}

function generateAssessmentBatch(categoryLabel, topicTitle, count) {
  const newQs = buildTopicQuickQuestions(topicTitle, count, categoryLabel);
  state.questions = [...newQs, ...state.questions];
  state.quizMeta = {
    mapel: state.classProfile.mapel,
    kelas: state.classProfile.kelas,
    materi: topicTitle
  };
  persistStateToStorage(true);
  showToast(`Berhasil membuat <b>${newQs.length} soal</b> (${categoryLabel})!`, "success");
  render();
}

function startInteractiveQuiz(categoryFilter = null) {
  const pool = categoryFilter
    ? state.questions.filter(q => q.category === categoryFilter)
    : state.questions;
  if (pool.length === 0) {
    showToast("Belum ada soal pada kategori ini. Buat soal terlebih dahulu.", "error");
    return;
  }
  const roster = getActiveClassStudents();
  const currentSelected = state.quizPlay?.studentName;
  const defaultName =
    (currentSelected && roster.some(s => s.nama === currentSelected))
      ? currentSelected
      : (roster[0]?.nama || "Siswa Kelas");
  state.quizPlay = {
    tab: "play",
    studentMode: true,
    studentName: defaultName,
    customNameMode: false,
    currentIdx: 0,
    score: 0,
    answered: false,
    pool
  };
  state.soalPenilaianTab = "kuis-interaktif";
  render();
}

function answerQuizOption(selectedAns) {
  const qp = state.quizPlay;
  if (!qp || qp.answered || !qp.pool) return;
  const q = qp.pool[qp.currentIdx];
  qp.answered = true;
  if (selectedAns === q.correct) {
    qp.score += 1;
    showToast("Jawaban Benar! 🎉", "success");
  } else {
    showToast(`Kurang tepat. Kunci: <b>${escapeHtml(q.correct)}</b>`, "error");
  }
  render();
}

function nextQuizQuestion() {
  const qp = state.quizPlay;
  if (!qp || !qp.pool) return;
  if (qp.currentIdx + 1 < qp.pool.length) {
    qp.currentIdx += 1;
    qp.answered = false;
    render();
    return;
  }
  const finalScore = Math.round((qp.score / qp.pool.length) * 100);
  const predikat = finalScore >= 85 ? "Sangat Baik (Tuntas)" : finalScore >= 75 ? "Baik (Tuntas)" : "Perlu Bimbingan";
  state.scoreRecords.unshift({
    id: Date.now(),
    nama: qp.studentName || "Siswa",
    materi: state.quizMeta.materi || state.classProfile.mapel,
    skor: finalScore,
    predikat,
    waktu: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })
  });
  qp.studentMode = false;
  state.soalPenilaianTab = "daftar-nilai";
  persistStateToStorage(true);
  showToast(`Kuis selesai! Skor akhir: <b>${finalScore}</b> (${predikat})`, "success");
  render();
}

function toggleStudentAttendance(idx, statusCode) {
  const roster = getActiveClassStudents();
  if (!roster[idx]) return;
  roster[idx].status = statusCode;
  persistStateToStorage(true);
  render();
}

function handleAddJournal(e) {
  e.preventDefault();
  const tanggal = document.getElementById("jur-tgl").value;
  const pertemuan = document.getElementById("jur-pert").value.trim();
  const materi = document.getElementById("jur-materi").value.trim();
  const kegiatan = document.getElementById("jur-keg").value.trim();
  if (!pertemuan || !materi) return;

  state.journals.unshift({
    id: Date.now(),
    tanggal,
    pertemuan,
    materi,
    kegiatan
  });
  persistStateToStorage(true);
  showToast("Catatan jurnal mengajar berhasil ditambahkan!", "success");
  render();
}

function approveAccessRequest(reqId) {
  const req = state.accessRequests.find(r => r.id === reqId);
  if (!req) return;
  req.status = "disetujui";
  const exists = state.registeredUsers.some(u => u.email.toLowerCase() === req.email.toLowerCase());
  if (!exists) {
    state.registeredUsers.push({
      id: "usr-" + Date.now(),
      name: req.name,
      email: req.email,
      password: req.password,
      sekolah: req.sekolah,
      role: "guru",
      status: "aktif",
      joinedAt: new Date().toISOString().slice(0, 10)
    });
  }
  persistStateToStorage(true);
  showToast(`Akun <b>${escapeHtml(req.name)}</b> berhasil diaktifkan!`, "success");
  render();
}

          <div class="space-y-3">
            ${state.accessRequests.map(r => `
              <div class="p-4 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div>
                  <div class="font-extrabold text-slate-900">${escapeHtml(r.name)} (${escapeHtml(r.sekolah)})</div>
                  <div class="text-slate-600">${escapeHtml(r.email)} · WA: ${escapeHtml(r.whatsapp)} · ${escapeHtml(r.tanggal)}</div>
                </div>
                <div>
                  ${r.status === "menunggu" ? `
                    <button type="button" onclick="approveAccessRequest('${r.id}')" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold">
                      ✓ Setujui &amp; Aktifkan
                    </button>
                  ` : `<span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold">Aktif</span>`}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      ` : ""}
    </main>
    ${renderFooter()}
  `;
}

/**
 * ============================================================================
 * 5C. MODAL PUBLIKASI & EKSPOR APLIKASI WEB MANDIRI SIAP HOSTING
 * ============================================================================
 */
function openPublishModal() {
  state.publishModalOpen = true;
  render();
}

function closePublishModal() {
  state.publishModalOpen = false;
  render();
}

function getPublicShareUrl() {
  const href = window.location.href || "";
  if (href.startsWith("http://") || href.startsWith("https://")) {
    return href.split("#")[0];
  }
  return "https://guru-cerdas.netlify.app";
}

function downloadPublishableHtmlPackage() {
  const docClone = document.documentElement.cloneNode(true);
  const rootEl = docClone.querySelector("#app-root");
  if (rootEl) rootEl.innerHTML = "";
  const toastEl = docClone.querySelector("#global-toast");
  if (toastEl) {
    toastEl.classList.add("translate-y-24", "opacity-0", "pointer-events-none");
  }
  const htmlContent = "<!DOCTYPE html>\n" + docClone.outerHTML;
  const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("File <b>index.html</b> siap hosting berhasil diunduh! Unggah ke Netlify Drop, Vercel, atau GitHub Pages agar dapat diakses publik.", "success");
}

function renderPublishModal() {
  if (!state.publishModalOpen) return "";
  const shareUrl = getPublicShareUrl();
  const isLiveHttp = window.location.protocol === "http:" || window.location.protocol === "https:";

  return `
    <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 no-print">
      <div class="bg-white rounded-3xl border border-slate-200 max-w-lg w-full p-6 sm:p-7 shadow-2xl space-y-5">
        <div class="flex items-start justify-between gap-3">
          <div>
            <span class="inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-900 text-[11px] font-extrabold mb-1.5">
              🌐 PUBLIKASI &amp; AKSES PUBLIK
            </span>
            <h2 class="text-xl font-extrabold text-slate-900">Publikasikan Aplikasi GURU CERDAS</h2>
            <p class="text-xs text-slate-600 mt-1">Bagikan tautan aplikasi atau unduh paket <code>index.html</code> untuk di-hosting gratis selamanya.</p>
          </div>
          <button type="button" onclick="closePublishModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">✕</button>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-800">Tautan Akses Publik Saat Ini</label>
          <div class="flex gap-2">
            <input type="text" readonly value="${escapeHtml(shareUrl)}" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-xs font-mono text-slate-800">
            <button type="button" onclick="copyTextFallback('${escapeHtml(shareUrl)}', 'Tautan publik berhasil disalin!')" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-extrabold shrink-0">
              Salin Link
            </button>
          </div>
          ${!isLiveHttp ? `
            <p class="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded-xl p-2.5">
              Anda sedang membuka aplikasi dalam mode pratinjau lokal. Unduh <b>index.html</b> di bawah ini lalu unggah ke layanan hosting gratis agar memiliki alamat web publik (HTTPS).
            </p>
          ` : ""}
        </div>

        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
          <div class="text-xs font-extrabold text-slate-900">Langkah Publikasi Gratis (1 Menit Online):</div>
          <ol class="list-decimal list-inside text-xs text-slate-600 space-y-1">
            <li>Klik tombol <b>Unduh Paket index.html</b> di bawah ini.</li>
            <li>Buka <b>app.netlify.com/drop</b>, <b>vercel.com</b>, atau <b>GitHub Pages</b>.</li>
            <li>Seret &amp; lepas file <code>index.html</code> tersebut untuk langsung mendapatkan URL publik yang dapat diakses guru/siswa dari HP maupun laptop.</li>
          </ol>
          <button type="button" onclick="downloadPublishableHtmlPackage()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-sm transition">
            📥 Unduh Paket Publikasi (index.html)
          </button>
        </div>
      </div>
    </div>
  `;
}

function renderFooter() {
  return `
    <footer class="border-t border-slate-200 bg-white py-5 px-4 text-center text-xs text-slate-500 no-print">
      <div class="max-w-6xl mx-auto space-y-1">
        <div>Platform Perangkat Ajar &amp; Asesmen Kurikulum Nasional (Kepka BSKAP 046/2025 &amp; Kemenag)</div>
        <div>© 2026 <b>GURU CERDAS</b> - Developed by Ika Rohmatullah F., S.Pd.</div>
      </div>
    </footer>
  `;
}

function render() {
  persistStateToStorage(true);
  const root = document.getElementById("app-root");
  let pageHtml = "";
  switch (state.activeRoute) {
    case "landing":
      pageHtml = renderLandingPage();
      break;
    case "login":
      pageHtml = renderLoginPage();
      break;
    case "daftar":
      pageHtml = renderDaftarPage();
      break;
    case "cek-gratis":
      pageHtml = renderCekGratisPage();
      break;
    case "dashboard":
      pageHtml = renderDashboard();
      break;
    case "data-sekolah":
      pageHtml = renderDataSekolahPage();
      break;
    case "profil-kelas":
      applyRosterCountToClassProfile(getActiveClassStudents(), false);
      pageHtml = renderProfilKelasPage();
      break;
    case "daftar-siswa":
      applyRosterCountToClassProfile(getActiveClassStudents(), false);
      pageHtml = renderDaftarSiswaPage();
      break;
    case "generator":
      pageHtml = renderGeneratorPage();
      break;
    case "soal-penilaian":
      pageHtml = renderSoalPenilaianPage();
      break;
    case "kuis":
      state.soalPenilaianTab = "harian-kuis";
      pageHtml = renderSoalPenilaianPage();
      break;
    case "nilai":
      state.soalPenilaianTab = "daftar-nilai";
      pageHtml = renderSoalPenilaianPage();
      break;
    case "presensi":
      pageHtml = renderPresensiPage();
      break;
    case "akun":
      pageHtml = renderAkunPage();
      break;
    default:
      pageHtml = renderLandingPage();
  }
  root.innerHTML = pageHtml + renderPublishModal();
}

// Muat data tersimpan sebelum aplikasi dirender pertama kali
loadStateFromStorage();

// Mulai Aplikasi
render();
</script>

</html>
